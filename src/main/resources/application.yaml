spring:
  application:
    name: shopper
  datasource:
    url: jdbc:h2:mem:demo;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

redis:
  host: localhost
  port: 6379
  timeout: 2000
  jedis:
    max-total: 50
    max-idle: 20
    min-idle: 5

cache:
  product:
    ttl-seconds: 600  # 10 minutes
